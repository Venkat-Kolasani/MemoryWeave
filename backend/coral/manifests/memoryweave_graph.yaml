name: memoryweave_graph
version: 0.1.0
dsl_version: 3
backend: file
description: >-
  Query Acme Corp knowledge graph nodes and edges from packaged JSONL snapshots.
  This keeps Coral SQL reliable on Render while the app UI still reads the live Neo4j graph.

tables:
  - name: knowledge_nodes
    description: >-
      Knowledge graph nodes — people, systems, incidents, workflows.
      Schema id, name, type, risk_score, team, role, criticality.
    format: jsonl
    source:
      location: file://__MEMORYWEAVE_CORAL_DATA__/
      glob: knowledge_nodes.jsonl
    columns:
      - name: id
        type: Utf8
        nullable: false
        description: Node id (e.g. p1, s1).
      - name: name
        type: Utf8
        nullable: true
        description: Display name.
      - name: type
        type: Utf8
        nullable: true
        description: Entity type (Person, System, Incident, Workflow).
      - name: risk_score
        type: Float64
        nullable: true
        description: Bus-factor / risk score.
      - name: team
        type: Utf8
        nullable: true
        description: Team name for people.
      - name: role
        type: Utf8
        nullable: true
        description: Role for people.
      - name: criticality
        type: Utf8
        nullable: true
        description: Criticality for systems or incident severity.

  - name: knowledge_edges
    description: >-
      Directed relationships between graph entities.
      Schema from_id, from_name, from_type, rel_type, weight, to_id, to_name, to_type.
    format: jsonl
    source:
      location: file://__MEMORYWEAVE_CORAL_DATA__/
      glob: knowledge_edges.jsonl
    columns:
      - name: from_id
        type: Utf8
        nullable: true
      - name: from_name
        type: Utf8
        nullable: true
      - name: from_type
        type: Utf8
        nullable: true
      - name: rel_type
        type: Utf8
        nullable: true
      - name: weight
        type: Float64
        nullable: true
      - name: to_id
        type: Utf8
        nullable: true
      - name: to_name
        type: Utf8
        nullable: true
      - name: to_type
        type: Utf8
        nullable: true

test_queries:
  - SELECT * FROM memoryweave_graph.knowledge_nodes LIMIT 5
  - SELECT * FROM memoryweave_graph.knowledge_edges LIMIT 5
