# Render Blueprint — MemoryWeave API
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: memoryweave-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CHROMA_MODE
        value: inmemory
      - key: PYTHON_VERSION
        value: "3.11.9"
